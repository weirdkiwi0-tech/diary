<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 하루 어땠나요? | 고등학생 감정일기</title>
    <meta name="description" content="고등학생들을 위한 AI 감정일기 상담 서비스입니다. 당신의 오늘을 기록하고 위로를 받으세요.">
    <!-- Google Fonts: Inter 및 Nanum Square Neo (가정) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1 id="main-title">오늘 하루 어땠나요?</h1>
            <p class="subtitle">작은 기록이 당신의 마음을 안아줄 거예요.</p>
        </header>

        <section class="diary-section">
            <div class="input-card">
                <textarea id="diary-input" placeholder="여기에 당신의 이야기를 들려주세요..." aria-label="감정일기 입력창"></textarea>
                
                <div class="button-group">
                    <button id="voice-input-btn" class="btn btn-secondary" title="음성으로 입력하기">
                        <span class="icon">🎤</span> 음성 입력
                    </button>
                    <button id="ai-consultant-btn" class="btn btn-primary" title="AI 상담사에게 물어보기">
                        <span class="icon">✨</span> AI 상담사
                    </button>
                </div>

                <!-- AI 답변 영역을 버튼 바로 아래로 배치 -->
                <div id="ai-response-section" class="response-section hidden">
                    <div class="response-card">
                        <div class="card-header">
                            <span class="bot-icon">🤖</span>
                            <h3>AI 상담사의 따뜻한 한마디</h3>
                        </div>
                        <div id="ai-response-text" class="response-content">
                            <!-- AI 답변이 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
